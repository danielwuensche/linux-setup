---

- name: "Install packages"
  ansible.builtin.package:
    name: "lizardbyte/sunshine"
    state: present
  become: true

- name: "Ensure sunshine config directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/sunshine"
    state: "directory"

- name: "Copy apps.json"
  ansible.builtin.copy:
    src: "files/apps.json"
    dest: "{{ ansible_facts.user_dir }}/.config/sunshine/apps.json"

- name: "Get current sunshine binary path"
  ansible.builtin.stat:
   path: "/usr/bin/sunshine"
  register: reg_sunshine_binary

- name: "Enable service"
  ansible.builtin.service:
    name: "{{ sunshine_service_name }}"
    scope: "user"
    enabled: true

- name: "Start service"
  ansible.builtin.service:
    name: "{{ sunshine_service_name }}"
    scope: "user"
    state: "started"

