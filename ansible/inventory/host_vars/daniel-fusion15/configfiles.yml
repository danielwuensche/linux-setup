---

configfiles_aliases__local:
  "kbon": 'ite8291r3-ctl monocolor -b 5 --rgb 80,0,128'
  "kboff": 'ite8291r3-ctl off'
  "gpuoff": "sudo /usr/local/bin/gpuoff"
  "gpuon": "sudo /usr/local/bin/gpuon"

configfiles_profile__local:
  - 'export PATH=".local/share/gem/ruby/3.2.0/bin:$PATH"'
  - 'gsettings set org.gnome.desktop.interface gtk-theme "breeze-dark"'
  - 'export QT_QPA_PLATFORM=wayland'
  - 'export QT_QPA_PLATFORMTHEME=qt6ct'
