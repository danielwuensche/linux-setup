---

- name: "Linux Setup"
  hosts: all
  
  tasks:
    - name: "Execute role"
      ansible.builtin.include_role:
        role: "{{ _role }}"
      when: "'role_' ~ _role in group_names"
      loop:
        - "system"
        - "packages"
        - "tuxedo_control_center"
        - "mkinitcpio"
        - "grub"
        - "sddm"
        - "nvidia"
        - "thermald"
        - "intel_undervolt"
        - "ite8291"
        - "configfiles"
        - "neovim"
        - "keepassxc"
        - "brave"
        - "thunderbird"
        - "discord"
        - "sunshine"
      loop_control:
        loop_var: _role
