---

- name: "Update packages"
  ansible.builtin.package:
    upgrade: true
  become: true

- name: "Install packages"
  ansible.builtin.package:
    name: "{{ packages_install }}"
    state: "present"
  become: true
  when: 
    - "packages_install is defined"
    - "packages_install is iterable and packages_install is not string"
